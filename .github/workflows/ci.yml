name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the pinned analysis stack
        run: pip install -r requirements.txt

      # Everything pytest needs is tracked in the repo (the frozen matrix and
      # the report CSVs ship under phase1/), so a clean clone runs the suite
      # as-is. Tests that bind numbers to the unpublished manuscript draft on
      # the author's Desktop skip by design when the draft is absent; the rest
      # collect and pass. Reference behaviour on a clean clone: 48 collected /
      # 44 passed / 4 skipped for the pre-revision suite, more as guardrail
      # tests are added.
      - name: Run the guardrail suite
        run: pytest
