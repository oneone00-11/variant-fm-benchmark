name: reproduce

# The one command a reader runs, on machines other than the author's: a fresh
# checkout, then `bash reproduce.sh`, which builds the pinned environment, fetches
# the two public inputs (ClinVar from NCBI, the atlas release archive from Zenodo),
# rebuilds every output of the evidence-strength study and fails unless each one
# matches the committed file. A tag push runs it on exactly the tagged tree.
on:
  push:
    branches: [evidence/rework]
    tags: ["v*"]
    # Skip pushes that change only documentation, but not the two Markdown files the
    # pipeline writes or reads; a later pattern overrides an earlier one. Path filters
    # are not evaluated for tag pushes, which always run.
    paths:
      - "**"
      - "!**.md"
      - "!CITATION.cff"
      - "docs/evidence-delta.md"
      - "docs/column-provenance.md"
  workflow_dispatch:

jobs:
  macos-arm64:
    # The platform the committed outputs were made on (macOS arm64, Python 3.12):
    # every output must match byte for byte, the build time aside.
    runs-on: macos-14
    timeout-minutes: 300          # the ClinVar download alone has taken an hour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"   # the outputs were made with 3.12.13
      - name: bash reproduce.sh
        run: bash reproduce.sh
      - name: Upload the per-file comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-report-macos-arm64
          path: reproduce_report.txt
          if-no-files-found: warn

  linux:
    # Informational: which outputs differ off macOS, and whether the numbers do. The
    # figures use Arial, which Linux runners lack, and numpy links a different BLAS.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"   # the outputs were made with 3.12.13
      - name: bash reproduce.sh
        run: bash reproduce.sh
      - name: Upload the per-file comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-report-linux
          path: reproduce_report.txt
          if-no-files-found: warn
