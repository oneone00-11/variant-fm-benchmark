name: reproduce

# The reproduction of the evidence-strength study on machines other than the author's,
# in the reference environment (stage B6): the Docker image container/ENVIRONMENT.json
# records, pulled by its manifest digest, in which every committed output was written.
# The inputs the repository does not carry are fetched online (ClinVar from NCBI, the
# atlas release archive from Zenodo, the four Ensembl chromosomes of the E16
# reference-base check, the label audit's sources); then every stage runs and every
# output is compared with the committed file, with no network (container/run.sh). A tag
# push runs it on exactly the tagged tree.
on:
  push:
    branches: [evidence/rework]
    tags: ["v*"]
    # Skip pushes that change only documentation, but not the Markdown files the
    # pipeline writes or reads; a later pattern overrides an earlier one. Path filters
    # are not evaluated for tag pushes, which always run.
    paths:
      - "**"
      - "!**.md"
      - "!CITATION.cff"
      - "docs/evidence-delta.md"
      - "docs/practical-metrics-summary.md"
      - "docs/newgenes-record-check.md"
      - "docs/sbds-record-check.md"
      - "docs/label-source-audit.md"
      - "docs/column-provenance.md"
  workflow_dispatch:

defaults:
  run:
    shell: bash        # -eo pipefail

jobs:
  image:
    # Required. It must end REPRODUCED, every output byte for byte (a manifest's build
    # time aside); REPRODUCED NUMERICALLY does not pass here. Then the test suite runs in
    # the same image, with no network, and must pass and leave the tree as it found it.
    runs-on: ubuntu-24.04
    timeout-minutes: 300          # the ClinVar download alone has taken an hour
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # the whole history: the tests that read it run as in a clone
      - name: Pull the reference image by the digest container/ENVIRONMENT.json records
        env:
          TOKEN: ${{ github.token }}
        run: |
          IMAGE="$(python3 -c 'import json; print(json.load(open("container/ENVIRONMENT.json"))["image"]["reference"])')"
          case "$IMAGE" in ghcr.io/*@sha256:*) ;; *) echo "no image digest recorded" >&2; exit 1 ;; esac
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
          grep -m1 "model name" /proc/cpuinfo
      - name: Fetch the inputs (online)
        run: |
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo "$IMAGE" bash container/run.sh fetch
      - name: Run every stage and compare (no network)
        run: |
          start=$(date +%s)
          docker run --rm --platform linux/amd64 --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo "$IMAGE" bash container/run.sh verify
          echo "seconds: $(( $(date +%s) - start ))"
      - name: Require REPRODUCED, byte for byte
        run: |
          sed -n 2p reproduce_report.txt
          [ "$(sed -n 2p reproduce_report.txt)" = \
            "# REPRODUCED: every output matches the committed one byte for byte." ]
      - name: Run the test suite in the image (no network)
        run: |
          # A REPRODUCED run leaves the tree as committed but for the build time six
          # records carry. Those are put back first, so that the tests read the committed
          # files and the tree is clean before them; it must be clean after them too.
          git checkout -- .
          git status --short
          [ -z "$(git status --short)" ]
          docker run --rm --platform linux/amd64 --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo "$IMAGE" bash container/run.sh test
          git status --short
          [ -z "$(git status --short)" ]
      - name: Upload the per-file comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reproduce-report-image
          path: reproduce_report.txt
          if-no-files-found: warn
      - name: Collect the files that are not identical
        if: always()
        run: |
          mkdir -p not-identical
          if [ -f reproduce_report.txt ]; then
            grep -E '^(differs|not rewritten|new)' reproduce_report.txt | cut -f2 |
              while read -r f; do
                [ -f "$f" ] && mkdir -p "not-identical/$(dirname "$f")" && cp "$f" "not-identical/$f"
              done || true
          fi
      - name: Upload the files that are not identical
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reproduce-not-identical-image
          path: not-identical
          if-no-files-found: ignore

  macos-arm64:
    # For the record, not required (the author's decision of 2026-10-22): the native
    # path, `bash reproduce.sh` with the runner's own Python 3.12 (GitHub's macos-15
    # runner, Apple silicon on macOS 15; the first step prints the chip and the system),
    # against the outputs the image wrote. It cannot end REPRODUCED there: Pillow
    # compresses the PNG figures into other bytes (the pixels are the same), the TP53
    # manifest's reproduction check counts one more value identical on arm64, and the
    # maths libraries move last digits. Its verdict is recorded, not enforced. After it,
    # scripts/stage_B6/compare_png_pixels.py says in the job summary, for each PNG,
    # whether its bytes, or only its bytes and not its pixels, or its pixels differ.
    runs-on: macos-15           # macos-14's image was retired on 2026-11-02
    continue-on-error: true
    timeout-minutes: 300          # the ClinVar download alone has taken an hour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: The machine and the system
        run: |
          sysctl -n machdep.cpu.brand_string hw.model
          sw_vers
      - name: bash reproduce.sh
        run: bash reproduce.sh
      - name: Compare the PNG figures pixel by pixel with the committed ones
        if: always()
        run: |
          .venv/bin/python scripts/stage_B6/compare_png_pixels.py \
            --out "$RUNNER_TEMP/png_pixels.md" > /dev/null
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/png_pixels.md"
      - name: Upload the per-file comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reproduce-report-macos-arm64
          path: reproduce_report.txt
          if-no-files-found: warn
      - name: Collect the files that are not identical
        if: always()
        run: |
          mkdir -p not-identical
          if [ -f reproduce_report.txt ]; then
            grep -E '^(differs|not rewritten|new)' reproduce_report.txt | cut -f2 |
              while read -r f; do
                [ -f "$f" ] && mkdir -p "not-identical/$(dirname "$f")" && cp "$f" "not-identical/$f"
              done || true
          fi
      - name: Upload the files that are not identical
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reproduce-not-identical-macos-arm64
          path: not-identical
          if-no-files-found: ignore
