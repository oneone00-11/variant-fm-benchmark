name: reproduce

# The one command a reader runs, on machines other than the author's: a fresh
# checkout, then `bash reproduce.sh`, which builds the pinned environment, fetches
# the two public inputs (ClinVar from NCBI, the atlas release archive from Zenodo),
# rebuilds every output of the evidence-strength study and fails unless each one
# matches the committed file. A tag push runs it on exactly the tagged tree.
on:
  push:
    branches: [evidence/rework]
    tags: ["v*"]
    # Skip pushes that change only documentation, but not the two Markdown files the
    # pipeline writes or reads; a later pattern overrides an earlier one. Path filters
    # are not evaluated for tag pushes, which always run.
    paths:
      - "**"
      - "!**.md"
      - "!CITATION.cff"
      - "docs/evidence-delta.md"
      - "docs/column-provenance.md"
  workflow_dispatch:

jobs:
  macos-arm64:
    # The platform the committed outputs were made on (macOS arm64, Python 3.12). It
    # must end REPRODUCED or REPRODUCED NUMERICALLY: every printed table and figure
    # byte for byte, other files at most in the last digits, which the runner's
    # Accelerate library (an M1 on macOS 14) can move.
    runs-on: macos-14
    timeout-minutes: 300          # the ClinVar download alone has taken an hour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bash reproduce.sh
        run: bash reproduce.sh
      - name: Upload the per-file comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-report-macos-arm64
          path: reproduce_report.txt
          if-no-files-found: warn
      - name: Collect the files that are not identical
        if: always()
        run: |
          mkdir -p not-identical
          if [ -f reproduce_report.txt ]; then
            grep -E '^(differs|not rewritten|new)' reproduce_report.txt | cut -f2 |
              while read -r f; do
                [ -f "$f" ] && mkdir -p "not-identical/$(dirname "$f")" && cp "$f" "not-identical/$f"
              done || true
          fi
      - name: Upload the files that are not identical
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-not-identical-macos-arm64
          path: not-identical
          if-no-files-found: ignore

  linux:
    # Informational: which outputs differ off macOS, and whether the numbers do. The
    # figures use Arial, which Linux runners lack, and numpy links a different BLAS.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bash reproduce.sh
        run: bash reproduce.sh
      - name: Upload the per-file comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-report-linux
          path: reproduce_report.txt
          if-no-files-found: warn
      - name: Collect the files that are not identical
        if: always()
        run: |
          mkdir -p not-identical
          if [ -f reproduce_report.txt ]; then
            grep -E '^(differs|not rewritten|new)' reproduce_report.txt | cut -f2 |
              while read -r f; do
                [ -f "$f" ] && mkdir -p "not-identical/$(dirname "$f")" && cp "$f" "not-identical/$f"
              done || true
          fi
      - name: Upload the files that are not identical
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-not-identical-linux
          path: not-identical
          if-no-files-found: ignore
