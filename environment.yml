# Conda alternative to requirements.txt for reproducing the analysis (CPU-only).
#   conda env create -f environment.yml
#   conda activate variant-fm-benchmark
#   python scripts/reproduce_main.py
name: variant-fm-benchmark
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pandas=2.3.3
  - numpy=2.0.2
  - scipy=1.13.1
  - scikit-learn=1.6.1
  - matplotlib=3.9.4
  - requests=2.32.5
  - tqdm=4.68.3
  # Optional re-scoring deps (not needed to reproduce results):
  # - pysam
  # - pip
  # - pip:
  #     - alphagenome
