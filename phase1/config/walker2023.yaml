# Walker et al. 2023 -- ClinGen SVI Splicing Subgroup recommendations.
# Transcribed verbatim for use by src/evid_walker_thresholds.py. Every entry
# carries the place in the source it was taken from.
#
# Source of record (published):
#   Walker LC, Hoya M de la, Wiggins GAR, et al. "Using the ACMG/AMP framework to
#   capture evidence related to predicted and observed impact on splicing:
#   Recommendations from the ClinGen SVI Splicing Subgroup."
#   Am J Hum Genet 2023;110(7):1046-1067. doi:10.1016/j.ajhg.2023.06.002
#   PMID 37352859, PMC10357475.
#
# How this file was built, and what that limits:
#   The publisher blocks full-text retrieval of the AJHG version from this machine
#   (cell.com and sciencedirect.com return HTTP 403; the Europe PMC and NCBI
#   full-text XML endpoints refuse the record: "The publisher of this article does
#   not allow downloading of the full text in XML form"). Two sources were used
#   instead and cross-checked against each other:
#     A. the author preprint, full text retrieved as JATS XML from Europe PMC
#        (PMC9980257, medRxiv, CC-BY): every quoted sentence and every cell of the
#        threshold table below is verbatim from it;
#     B. the published PMC record (PMC10357475), read through a page-rendering
#        fetch, which supplied the PUBLISHED table number and caption and confirmed
#        the same sentences and the same table cells.
#   Table numbering differs between the two: the threshold table is Table 2 in the
#   preprint and Table 1 in the published version. The published numbering is used
#   in `source` fields below and the preprint number is given beside it.
#   VERIFIED 2026-09-20 against the publisher PDF (23 pages; the first is the
#   unnumbered graphical abstract, so printed page = PDF page + 1044, giving the
#   article's 1046-1067). Every `source` below now carries the printed page. Two
#   items differ from the preprint and the published text wins; both are flagged
#   `preprint_differs` where they occur.

provenance:
  published:
    citation: "Walker LC et al. Am J Hum Genet 2023;110(7):1046-1067"
    doi: "10.1016/j.ajhg.2023.06.002"
    pmid: "37352859"
    pmcid: "PMC10357475"
    retrieved: "2026-09-17"
    access: "page-rendering fetch of the PMC record; publisher blocks XML/PDF here"
  preprint:
    citation: "medRxiv preprint of the same work"
    pmcid: "PMC9980257"
    retrieved: "2026-09-17"
    access: "Europe PMC REST fullTextXML (JATS), CC-BY"
    local_copy: "verbatim text cached outside the repo during transcription"
  publisher_pdf:
    checked: "2026-09-20"
    pages: 23
    page_mapping: "printed = PDF page + 1044 (PDF p.1 is the unnumbered graphical abstract)"
    location: "outside the repository; not redistributable"
  page_numbers: "verified against the publisher PDF"

# ---------------------------------------------------------------------------
# The score the thresholds are defined on.
# ---------------------------------------------------------------------------
score_definition:
  tool: "SpliceAI"
  version: "1.3.1"
  statistic: "maximum raw delta score over the four output probabilities
              (acceptor loss, acceptor gain, donor loss, donor gain)"
  masked: false          # "maximum RAW delta score" -- SpliceAI -M 0
  distance: 4999         # "maximum distance of 10,000 nucleotides (+/-4,999 nucleotides)"
  source: "p. 1049, Methods, 'Splicing prediction analysis'"
  quote: >-
    We used the maximum raw SpliceAI delta score, defined as the maximum
    probability of altered splicing across 4 output probabilities (designated by the
    tool as loss of acceptor or donor sites, gain of acceptor or donor sites) and the
    maximum distance of 10,000 nucleotides (+/-4,999 nucleotides from the variant of
    interest).   [verbatim, p. 1049]

# ---------------------------------------------------------------------------
# The thresholds. Published Table 1 (= preprint Table 2).
# Caption (published): "Likelihood ratio analysis of the maximum SpliceAI delta
# score for variants located outside of donor/acceptor +/-1,2 dinucleotide
# positions using optimal cut offs".
# ---------------------------------------------------------------------------
thresholds:
  source: "Table 1, p. 1051 (Table 2 in the preprint); the sentences that assign the
           strengths are on p. 1056, Results, 'Model for establishing thresholds for
           splicing prediction tools'. Every cell of Table 1 was checked against the
           PDF and matches."
  scope: "variants located OUTSIDE the donor/acceptor +/-1,2 dinucleotides"
  applied_weight:
    pp3: "Supporting"
    bp4: "Supporting"
    source: "p. 1056, Discussion"
    quote: >-
      For this reason, combined with the results for sensitivity analysis
      considering LRs for narrow bands around selected cut points, a conservative
      approach is to calibrate codes to reach a moderate level of evidence but only
      apply predictive PP3/BP4 codes at a supporting weight.   [verbatim, p. 1056]
    higher_score_check: >-
      On the BRCA1 saturation genome editing data (414 variants), SpliceAI >= 0.5
      gave Strong evidence for an effect on cell survival (lower 95% CI of the LR
      18.58) and < 0.1 Moderate evidence for no effect [p. 1055, Table S10].
    higher_score_check_n_variants: 414
    higher_score_check_cut_point: 0.5
    higher_score_check_lr_lower_95: 18.58
    narrow_band_scores: [0.20, 0.22]
    narrow_band_lr: 2.52
    narrow_band_source: "p. 1056"
  pp3:
    operator: ">="
    value: 0.2
    acmg_code: "PP3"
    evidence_strength: "Moderate"
    direction: "spliceogenicity"
    reported_lr: 15.99
    reported_lr_ci: [13.23, 19.32]
    reported_n_splice_no: 109
    reported_n_splice_yes: 381
    reported_sensitivity_all_noncanonical: 0.78
    quote: >-
      Based on this analysis, the optimal threshold for assigning PP3 to variants
      outside the donor/acceptor +/-1,2 dinucleotides was determined to be >=0.2,
      which equated to a moderate level of evidence for spliceogenicity (Table 1 and
      Figures 3B and 4).   [verbatim, p. 1056]
    preprint_differs: >-
      The preprint cited "Table 2, Figure 2B, Figure 3" for the same sentence. Same
      content, different figure and table numbers; the published numbering is used
      throughout this file.
    note: >-
      The threshold's CALIBRATED strength is Moderate, in the table and in the
      sentence. The weight at which the recommendation APPLIES it is Supporting
      (thresholds.applied_weight below). An earlier version of this note read the
      "supporting" figure only as the narrow-band sensitivity analysis (score
      0.20-0.22, LR = 2.52) and said not to carry it; that was wrong. The narrow
      band is one of the two reasons the recommendation gives for applying the
      codes at Supporting weight, and both quantities belong in any statement of
      what the recommendation says.
  bp4:
    operator: "<="
    value: 0.1
    acmg_code: "BP4"
    evidence_strength: "Moderate"
    direction: "non-spliceogenicity"
    reported_lr: 0.17
    reported_lr_ci: [0.14, 0.21]
    reported_n_splice_no: 1962
    reported_n_splice_yes: 72
    reported_specificity_all_noncanonical: 0.87
    reported_specificity_standard_splice_region: 0.73
    quote: >-
      The optimal threshold for assigning BP4 was determined to be <=0.1 for
      moderate level of evidence for non-spliceogenicity, with 87% specificity for
      all variants outside the donor/acceptor +/-1,2 dinucleotides (Table 1) and 73%
      specificity for variants within the donor/acceptor splice region (Table S11).
      [verbatim, p. 1056]
  grey_zone:
    interval: "> 0.1 and < 0.2"
    evidence_strength: "Uninformative"
    action: "apply neither PP3 nor BP4"
    reported_lr: 1.00
    reported_lr_ci: [0.71, 1.39]
    reported_n_splice_no: 175
    reported_n_splice_yes: 38
    quote: >-
      This approach intentionally designated a middle category to represent a
      range of uninformative spliceogenicity scores and for which bioinformatic
      codes should not be applied (i.e. both PP3 and BP4 are not met).

# ---------------------------------------------------------------------------
# Canonical +/-1,2 dinucleotides.
# ---------------------------------------------------------------------------
canonical_pm12:
  pp3_bp4_applicable: false
  route: "PVS1 decision tree"
  source: "Figure 3 legend, p. 1057 (Figure 2 in the preprint)"
  quote: >-
    Note: truth datasets were filtered to exclude splice donor/acceptor +/-1,2
    dinucleotide variants, which are captured by the PVS1 decision tree process.
    [verbatim, p. 1057]
  consequence_for_this_analysis: >-
    The pm12 stratum is reported descriptively only. Applying the PP3/BP4 cut
    points there is outside the recommendation's own scope, so any LR quoted for
    pm12 is an out-of-scope extrapolation and is labelled as such.

# ---------------------------------------------------------------------------
# Other tools.
# ---------------------------------------------------------------------------
other_tools:
  thresholds_recommended: false
  source: "p. 1055, Results (ROC comparison, AUC = 0.959, Figure S5); the tool list
           is Table S3"
  note: >-
    Ten other splicing prediction tools were compared with SpliceAI by ROC/AUC on
    the BRCA1 saturation genome editing dataset of Findlay et al. (414 variants,
    312 functional and the rest loss-of-function, intermediates excluded). SpliceAI
    led at AUC = 0.959 for variants at conserved positions in the donor and acceptor
    regions. No numeric score threshold and no evidence strength is recommended for
    any tool other than SpliceAI, so no other tool enters the E2 fixed-threshold
    analysis.
    Note for this project, CORRECTED after checking the source. Two separate
    datasets are involved and both touch our seven genes:
      * the TOOL-RANKING comparison ran on Findlay's BRCA1 saturation genome
        editing (414 variants), which is one of the seven assays this analysis set
        is built on;
      * the THRESHOLD CALIBRATION ran on 2,736 variants outside the canonical sites
        across EIGHT genes -- BRCA1, BRCA2, MLH1, MSH2, MSH6, PMS2, NF1 and
        POU1F1 -- against in vitro splicing assay data curated from the literature.
    BRCA1 and BRCA2 are in that calibration set, and they are two of our seven. So
    applying these cut points here is NOT a clean out-of-sample test: the variants
    differ (literature in vitro splicing assays against SGE functional scores) and
    the endpoint differs (a splice event against gene function), but the genes
    overlap. An earlier version of this file asserted non-circularity flatly; that
    was wrong and is corrected here. The honest statement is that the overlap is at
    the gene level, not the variant level, and that the five non-overlapping genes
    (BARD1, PALB2, RAD51C, VHL, BAP1) and the external gene DDX3X are where the cut
    points are genuinely out of sample.

# ---------------------------------------------------------------------------
# Region definitions used by the source (recorded for reference; the strata of
# this analysis are defined by intronic offset and do not reuse them).
# ---------------------------------------------------------------------------
region_definitions:
  donor_acceptor_splice_region:
    donor: "last 3 bases of the exon and 3-6 nucleotides of intronic sequence adjacent to the exon"
    acceptor: "first base of the exon and from 3 to 20 nucleotides upstream from the exon boundary"
    source: "p. 1056, in the PP3 sentence's parenthesis, citing Figure 1"
    preprint_differs: >-
      CORRECTED against the PDF. The preprint gives single values -- 6 nucleotides
      on the donor side, 20 on the acceptor side -- and calls it the "standard
      splice region". The published text gives RANGES, 3-6 and 3-20, and calls it
      the "donor/acceptor splice region". The earlier transcription here carried the
      preprint's single values under the preprint's name; both are fixed. Nothing in
      this analysis is computed from these bounds -- the strata are defined by
      intronic offset -- so no number changes.
  minimal_splice_region:
    donor: "last 3 bases of the exon and 6 nucleotides of intronic sequence adjacent to the exon"
    acceptor: "first base of the exon and 3 nucleotides upstream from the exon boundary"
    source: "Methods, same section"
  stratum_note: >-
    Strength was unchanged when restricted to variants within the donor/acceptor
    splice region, and was at least Supporting for variants outside it
    (published Table S11; the preprint numbered the same table S10).

# ---------------------------------------------------------------------------
# Evidence bands. Walker designates strengths from Tavtigian LR ranges at a global
# prior of 0.10 (their Table S5). This analysis uses the same system and prior,
# and the same numeric band edges already used by both companion manuscripts.
# ---------------------------------------------------------------------------
evidence_bands:
  prior: 0.10
  prior_sensitivity: [0.05, 0.20]
  pathogenic_lr_thresholds:
    very_strong: 350.0
    strong: 18.7
    moderate: 4.33
    supporting: 2.08
  benign_lr_thresholds:   # reciprocals, as the point system implies
    very_strong: 0.002857142857142857
    strong: 0.05347593582887701
    moderate: 0.23094688221709006
    supporting: 0.4807692307692308
  source: "p. 1049-1050, Methods, 'Calibration of code weights based on odds of
           spliceogenicity' (Tavtigian et al. LR ranges, prior 0.10; their Table S5)"
  note: >-
    Walker's LRs are likelihood ratios for SPLICEOGENICITY (a splice event
    observed in an RNA assay), used as a surrogate for pathogenicity. The
    likelihood ratios computed in E2/E3 are against the SGE/MAVE functional
    standard (damaging vs normal gene function), which is a different endpoint.
    The bands are shared; the endpoint is not.

# ---------------------------------------------------------------------------
# Does our SpliceAI column match the score the thresholds were calibrated on?
# ---------------------------------------------------------------------------
column_check:
  atlas_column: "spliceai_ds (results/score_matrix_atlas_v2.parquet)"
  atlas_definition:
    tool_version: "SpliceAI 1.3.1"
    statistic: "max over the four delta scores, full float precision"
    masked: false        # models/spliceai/score_fullprec.py: MASK = 0
    distance: 50         # models/spliceai/score_fullprec.py: DISTANCE = 50
  verdict: "MISMATCH on distance only"
  detail: >-
    Version, statistic and masking agree with Walker. The scoring distance does
    not: the atlas column was produced at -D 50, Walker at -D 4999. A variant whose
    nearest predicted splice-site change lies more than 50 nt away scores 0 in the
    atlas column and can score above the PP3 cut point under Walker's setting.
  action: >-
    A separate column `spliceai_walker` is scored for the analysis set at
    distance 4999, mask 0, max over the four deltas, full precision, with the same
    pinned SpliceAI 1.3.1 environment and the same GRCh38 reference
    (src/evid_score_spliceai_walker.py). Once it exists, E2 applies the 0.2/0.1 cut
    points to it and `spliceai` (distance 50) stays as the panel's ranking column
    and as a sensitivity comparison. E2 reports which column it used and warns when
    only the distance-50 column is present, so a table produced before the re-score
    finished is not mistaken for one produced after.
  provenance_file: "data/evidence/spliceai_walker.parquet.provenance.json"
