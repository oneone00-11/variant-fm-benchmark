    description: "Variants at the BP7 positions meeting BP4, at the published cut point and at the fitted threshold, by gene and side of the exon."
    make: table_parts
    parts:
      # the condition column's two texts as the author worded them (E8.10, 2026-11-09):
      # (b) names the threshold by its table, as the configuration numbers it, and the
      # values at full precision move to the table's note; the source keeps its own
      - {part: bp4_bp7, source: reports/evidence/suppl_analyses/c6_bp4_bp7.csv,
         replace: [{old: "E19 C6: BP4", new: "BP4", count: 1},
                   {old: "(a) SpliceAI at or below the published cut, 0.1", new: "(a) SpliceAI at or below the published BP4 cut point, 0.1", count: 24},
                   {old: "(b) SpliceAI at or below Table 3(b)'s BP4 Supporting threshold: 3-10 nt 0.026069002225995064, 11-50 nt 0.0012704133987426758",
                    new: "(b) SpliceAI at or below the in-sample BP4 Supporting threshold of the band ({evidence_tiers_and_thresholds}(b))", count: 24},
                   {old: "Table 3(b)", new: "{evidence_tiers_and_thresholds}(b)", count: 2}]}
    notes:
      - "BP7 positions are donor +7 and beyond and acceptor −21 and beyond. Condition (b) uses the fitted thresholds at full precision (0.026069 at 3–10 bp and 0.0012704 at 11–50 bp). With the rounded values of {evidence_tiers_and_thresholds}(b), the two normal variants that lie exactly on these thresholds would not be counted; the damaging counts are unchanged."
  - content: vcep_rules
    kind: table
    number: Supplementary Table S32
    title: "The splicing rules of the ClinGen expert panels’ specifications applied to this study’s data: band likelihood ratios and tiers, and BP7 as each specification defines it."
    destination: excel
    description: "The splicing rules of the expert panels' specifications applied to this study's data: band likelihood ratios and tiers, and BP7 as each defines it."
    make: table_parts
    parts:
      - {part: band_lr, source: reports/evidence/suppl_analyses/c13_vcep_band_lr.csv,
         replace: [{old: "E20 C13: the VCEP", new: "The VCEP", count: 1},
                   {old: "defines it (E20b)", new: "defines it", count: 1},
                   {old: "(E20b; Appendices", new: "(Appendices", count: 1},
                   {old: "E2's (evid_walker_thresholds._band_stats)", new: "evid_walker_thresholds._band_stats", count: 1},
                   {old: " (E20.4)", new: "", count: 6}]}
    notes:
      - "Specifications: *BRCA1* and *BRCA2*, ENIGMA (GN092 and GN097, version 1.2) [39, 40]; *PALB2*, Hereditary Breast, Ovarian and Pancreatic Cancer panel (GN077, version 1.3) [41]; *VHL* (GN078, version 1.1) [42]. *BAP1*, *BARD1* and *RAD51C* have no current approved specification."
      - "Every rule is applied to SpliceAI on the published basis (version 1.3.1, distance 4,999, unmasked, the largest of the four delta scores). The ENIGMA appendix gives a maximum distance of 10,000, which neither SpliceAI column of this study has, so the rule’s cut point is applied to the column as it stands."
      - "BP7 follows each specification: ENIGMA, donor +7 and beyond and acceptor −21 and beyond, with BP4; *PALB2*, donor +8 and beyond and acceptor −22 and beyond, with and without BP4; *VHL* states no position, so this study’s distance bands are used, with SpliceAI at or below 0.1 and phyloP at or below 0.2. Not evaluated: VarSeak for *VHL*, and RNA evidence and PVS1 for *PALB2*."
      - "Intervals come from resampling within each class of the gene (2,000 draws), and tiers are given at the point estimate and at the conservative end of the interval. The labels are this study’s assay labels, and the *VHL* panel’s concern about using the *VHL* SGE data as functional evidence is not evaluated here. No specification is taken as the truth for this study’s thresholds, and no threshold is changed."
  - content: alphagenome_definitions
    kind: table
    number: Supplementary Table S33
    title: "The AlphaGenome splice score by the developers’ definition beside the atlas’s quantile-based composite: thresholds, band ratios, held-out transfer and AUROC."
    destination: excel
    description: "Thresholds, ratios, held-out transfer and AUROC of the AlphaGenome splice score by the model's own definition beside the atlas's quantile score."
    make: table_parts
    parts:
      - {part: comparison, source: reports/evidence/alphagenome_definition_comparison.csv,
         replace: [{old: "E3 writes per-fold thresholds for the PP3 side only", new: "per-fold thresholds are kept for the PP3 side only", count: 9}]}
    notes:
      - "The developers’ definition is the one used throughout ({alphagenome_and_atlas})."
  - content: by_splice_site_position
    kind: table
    number: Supplementary Table S34
    title: "Band likelihood ratios at the published cut points by position group on the donor and acceptor sides."
    destination: excel
    description: "Band likelihood ratios at the published cut points by position on the donor and acceptor sides."
    make: table_parts
    parts:
      - {part: by_position, source: reports/evidence/suppl_analyses/c7_by_position.csv}
    notes:
      - "Position groups: donor +3 to +6, +7 to +10 and +11 to +50; acceptor −3 to −10, −11 to −20 and −21 to −50. Intervals are 95% CIs from the gene-clustered bootstrap."

# The supplementary notes, in the text's order (the new numbers of E8.1's table, 2026-11-08):
