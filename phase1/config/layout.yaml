# The manuscript's figures and tables, main and supplementary (E5.3; read by
# src/evid_layout.py). Numbers are set here and nowhere else: each item's content name is
# stable and names its files, and its number, title and place in the list can change
# with the text. Titles, descriptions and notes are provisional placeholders, not the
# manuscript's wording: the titles of Supplementary Tables S1-S13 are
# supplement/supplement_tables_manifest.csv's, the others a neutral description. A note
# names another item as {content}, which the stage writes as that item's number.
# Numbering is provisional, in the order of the v5 text; what v5 does not cite follows
# it. Once the v6 text is final, the supplementary tables are numbered in the order the
# text first cites them, here alone (the author's decision of 2026-10-28). Paths are from
# phase1/.

# The figures' size and type (the author's decision of 2026-10-28, from the target's
# artwork guide, checked against the guide's text on 2026-10-28): no wider than the
# double-column width, a one-column figure no wider than the single-column width; type
# no smaller and no larger than these sizes; bitmaps at this resolution.
artwork:
  double_column_mm: 175
  single_column_mm: 85
  text_pt: [5, 7]
  dpi: 300

# How the supplement is to be assembled at submission (the author's decision of
# 2026-10-28; recorded now, used then): the supplementary figures, the tables marked pdf
# and the supplementary notes in one PDF; each table marked excel in Excel; every file
# with a description of at most this many words. A table's destination defaults to
# whether it fits on one page; contents.csv gives the stage's estimate beside it.
supplementary_format:
  rule: "Assembly at submission (provisional): the supplementary figures, the tables marked pdf and the supplementary notes in one PDF; the tables marked excel in Excel; every file with a description of at most 50 words."
  description_words: 50
  files:
    - file: the supplementary PDF
      description: "provisional: Supplementary figures, the shorter supplementary tables and the supplementary notes: methods, checks and analyses that support the main text."

# How a new supplementary table prints its cells (the author's decision of 2026-10-28):
# every column kept, under the name the table's map in `columns:` (at the end) gives;
# each cell by the column's type, as Supplementary Tables S1-S13 print a cell of that
# kind; the source files keep their full precision. Types: text (as written), count (a
# whole number), proportion (three decimals, or the decimals a third entry names, for a
# source that stores its shares rounded already: rounding them again would round twice),
# lr (three significant figures), threshold (four significant figures, more where four
# would move a variant across it; a published cut point as the configuration writes
# it), score (four significant figures), percent (one decimal), constant (a fixed value
# such as a prior, as the configuration writes it), number (three significant figures),
# boolean (Yes or No), tool, stratum, tier, side and label (the names S1-S13 print; an
# external gene's band cut at the depth its deposit reaches, as S12 and S13 cut it), or
# one of the maps below, codes to names. An infinite value prints as ∞.
display:
  values:
    threshold_kind: {walker_pp3: "Published cut point (≥ 0.2)", walker_bp4: "Published cut point (≤ 0.1)",
                     supporting: Supporting, moderate: Moderate, strong: Strong, very_strong: Very strong,
                     bp4_supporting: BP4 Supporting, bp4_moderate: BP4 Moderate}
    threshold_source: {published: Published, in_sample: In-sample, logo: "Held out (leave one gene out)",
                       logo_median: "Median of the leave-one-gene-out thresholds"}
    star_level: {stars_ge_1: At least one star, stars_ge_2: At least two stars}
    scope: {in_scope: In scope, out_of_scope_incl_pm12: Out of scope}
    # C12 read SpliceAI's events on the published basis, as S13's "Events read from"
    events_tool: {spliceai: SpliceAI (published basis), pangolin: Pangolin}
    gene_set: {seven genes: Seven genes, DDX3X: DDX3X, TP53: TP53}
    c12_group: {true_positive: True positives, false_positive: False positives}

