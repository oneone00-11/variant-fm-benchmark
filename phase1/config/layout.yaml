# The manuscript's figures and tables, main and supplementary (E5.3; read by
# src/evid_layout.py). Numbers are set here and nowhere else: each item's content name is
# stable and names its files, and its number, title and place in the list can change
# with the text. Every text the stage prints that names another item names it as
# {content} (a title, a description, a note, a part's replacement of a source's text),
# which the stage writes as that item's number.
# Numbering follows the text: the supplementary figures and tables are numbered in the
# order the text first cites them (2026-11-08; the author's decision of 2026-10-28), each
# list in its number's order; Tables 1-4 and Figures 1-3 keep theirs, and the
# supplementary notes are numbered below (supplementary_notes). The supplementary
# figures' and tables' titles, part titles, notes and legends, and the conventions, are
# the author's wording, approved on 2026-11-09 (E8.10) and copied here word for word,
# each reference to an item of this paper written {content} ({a, b} for several); a
# gene's italics are marked *GENE*. So are the main tables' titles, part titles and notes
# and the main figures' titles (E8.11; the main figures' legends are the manuscript's and
# stay there). The descriptions are not yet the text's. Paths are from phase1/.

# The figures' size and type (the author's decision of 2026-10-28, from the target's
# artwork guide, checked against the guide's text on 2026-10-28): no wider than the
# double-column width, a one-column figure no wider than the single-column width; type
# no smaller and no larger than these sizes; bitmaps at this resolution. No figure taller
# than max_height_mm (the author's review of 2026-10-28): a taller one is drawn shorter,
# not scaled at assembly, which would take its 5 pt type below 5 pt.
artwork:
  # the main figures' axes, ticks and lines, reference lines, medians and error bars
  # included, at least this wide in points; a marker's edge is not a line (the author's
  # decision of 2026-11-07, D3; the supplementary figures as drawn)
  main_lines_pt: 1.0
  double_column_mm: 175
  single_column_mm: 85
  max_height_mm: 240
  text_pt: [5, 7]
  dpi: 300

# How the supplement is to be assembled at submission (the author's decision of
# 2026-10-28; recorded now, used then): the supplementary figures, the tables marked pdf
# and the supplementary notes in one PDF; each table marked excel in Excel; every file
# with a description of at most this many words. A table's destination defaults to
# whether it fits on one page; contents.csv gives the stage's estimate beside it.
supplementary_format:
  # how the README sheet states the numbering
  numbering: "numbered in the order the text first cites them (2026-11-08)"
  rule: "Assembly at submission: the supplementary figures, the tables marked pdf and the supplementary notes in one PDF; the tables marked excel in Excel; every file with a description of at most 50 words."
  # the abbreviations and conventions of the supplementary tables and figures (the
  # author's wording, 2026-11-09): on the contents sheet of the workbook for submission
  conventions: "Abbreviations and conventions used in the supplementary tables and figures. AUPRC, area under the precision–recall curve; AUROC, area under the receiver operating characteristic curve; B/LB, benign or likely benign; CI, confidence interval; F1, harmonic mean of precision and recall; LR, likelihood ratio; MCC, Matthews correlation coefficient; NPV, negative predictive value; P/LP, pathogenic or likely pathogenic; PPV, positive predictive value; SGE, saturation genome editing; SNV, single-nucleotide variant; VCEP, ClinGen variant curation expert panel; VUS, variant of uncertain significance. Distances are in bp from the exon: the proximal band is 3–10 bp, the distal band 11–50 bp and the pooled window 3–50 bp; the canonical dinucleotides (1–2 bp) lie outside the scope of PP3 and BP4. Evidence tiers are read against the likelihood-ratio boundaries of Tavtigian and colleagues at a prior of 0.10: 2.08, 4.33, 18.7 and 350 for Supporting, Moderate, Strong and Very strong on the PP3 side, and 0.481, 0.231 and 0.0535 for Supporting, Moderate and Strong on the BP4 side ({local_lr_calibration}). In-sample thresholds are fitted on all training genes; held-out results apply a threshold fitted on the other genes to the gene left out; the published cut points are those of Walker and colleagues, 0.2 for PP3 and 0.1 for BP4 on SpliceAI. A dash marks a value not defined for that row."
  # the workbook for submission (layout/submission/, E8.10): its contents sheet's name and
  # first line, and the words after the tables marked pdf, which it lists from their
  # numbers
  submission_workbook: {sheet: Contents, heading: Supplementary Tables, pdf_tables: "are in the Supplementary Information PDF."}
  description_words: 50
  files:
    - file: the supplementary PDF
      description: "Supplementary figures, the shorter supplementary tables and the supplementary notes: methods, checks and analyses that support the main text."

# How a new supplementary table prints its cells (the author's decision of 2026-10-28):
# every column kept, under the name the table's map in `columns:` (at the end) gives; each
# cell by the column's type, as the tables v3.0.1 printed (supplement/) print a cell of
# that kind; the source files keep their full precision. Types: text (as written), count
# (a whole number), proportion (three decimals, or the decimals a third entry names, for a
# source that stores its shares rounded already: rounding them again would round twice),
# lr (three significant figures), threshold (four significant figures, more where four
# would move a variant across it; a published cut point as the configuration writes it),
# score (four significant figures), percent (one decimal), constant (a fixed value such as
# a prior, as the configuration writes it), number (three significant figures), boolean
# (Yes or No), tool, stratum, tier, side and label (the names those tables print; an
# external gene's band cut at the depth its deposit reaches, as they cut it), or one of
# the maps below, codes to names (with a third entry, `numbers as written`, a whole number
# the map does not name, or a bound such as >50, prints as it stands). An infinite value
# prints as ∞. A part's `replace` prints
# a text of its own in place of a source's, in the headers, the cells and the notes above
# the part, each `old` exactly `count` times (the stage stops otherwise), so that a number
# or a stage's code in a source is printed as the text needs it; the source stays as it
# is.
display:
  values:
    threshold_kind: {walker_pp3: "Published cut point (≥ 0.2)", walker_bp4: "Published cut point (≤ 0.1)",
                     supporting: Supporting, moderate: Moderate, strong: Strong, very_strong: Very strong,
                     bp4_supporting: BP4 Supporting, bp4_moderate: BP4 Moderate}
    threshold_source: {published: Published, in_sample: In-sample, logo: "Held out (leave one gene out)",
                       logo_median: "Median of the leave-one-gene-out thresholds"}
    star_level: {stars_ge_1: At least one star, stars_ge_2: At least two stars}
    scope: {in_scope: In scope, out_of_scope_incl_pm12: Out of scope}
    # the in-frame attribution read SpliceAI's events on the published basis, as
    # inframe_attribution's "Events read from"
    events_tool: {spliceai: SpliceAI (published basis), pangolin: Pangolin}
    gene_set: {seven genes: Seven genes, DDX3X: DDX3X, TP53: TP53}
    c12_group: {true_positive: True positives, false_positive: False positives}
    # the new genes' classes by intronic offset: how the offsets are binned, and the
    # bands' codes among the offsets (E8.10, the author's decision of 2026-11-09)
    bin_scheme: {per_nt: Per position, stratum: By distance band}
    offset_bin: {pm12: "1–2 (canonical dinucleotides)", s3_10: "3–10", s11_50: "11–50", s3_50: "3–50",
                 out_of_scope_deep: beyond 50}

main:
  # (c): one predictor's local likelihood ratio along its score in one distance band, the
  # curve local_lr_curves draws for them, on one axis (the author's decision of
  # 2026-11-04). The options name the predictor and the band; the band's curve file and
  # the thresholds' file are among the sources, and the stage stops if the curve file of
  # the options is not.
  - content: published_cut_point_by_band
    kind: figure
    number: Figure 1
    title: "Band likelihood ratios at the published SpliceAI cut points, and the local likelihood ratio along the score, in the seven training genes."
    make: figure_published_cut_point
    options: {c_tool: spliceai_walker, c_stratum: s3_10}
    sources:
      - reports/evidence/fig_data/fig1_walker_cutpoints.csv
      - reports/evidence/interval_lr_spliceai_walker_s3_10.csv
      - reports/evidence/evidence_thresholds.csv
    notes:
      - "(c) one distance band of one predictor; {local_lr_curves} draws every predictor in all three bands"
  - content: heldout_and_external_lr
    kind: figure
    number: Figure 2
    title: "Likelihood ratios at the fitted thresholds in held-out genes (a, b) and in the seven external genes (c)."
    make: figure_heldout_external
    sources:
      - reports/evidence/evidence_thresholds_logo_folds.csv
      - reports/evidence/evidence_thresholds.csv
      - reports/evidence/external_ddx3x.csv
      - reports/evidence/external_ctcf.csv
      - reports/evidence/external_sfpq.csv
      - reports/evidence/external_rad51d.csv
      - reports/evidence/external_xrcc2.csv
      - reports/evidence/external_sbds.csv
      - reports/evidence/external_tp53.csv
    notes:
      - "(c) the published cut point's row is judged against the Moderate boundary, 4.33: a marker is filled where the gene's ratio reaches it"
      - "(c) external genes are drawn without intervals; their intervals are in {external_genes}"
      - "TP53 is a different assay from the others' HAP1 cells: HCT116 cells, Nutlin-3a"
  - content: roc_curves
    kind: figure
    number: Figure 3
    title: "Receiver operating characteristic curves of four predictors in the seven training genes at 3–10 bp (a), 11–50 bp (b) and 3–50 bp (c)."
    make: figure_roc
    sources:
      - reports/evidence/practical_roc_curves.csv
      - reports/evidence/practical_pr_curves.csv
      - reports/evidence/practical_curve_auc.csv
      - reports/evidence/practical_metrics_by_threshold.csv
    notes:
      - "the legend gives the area under each curve drawn, the seven genes pooled into one curve; the text's AUROC combines per-gene AUROCs, a different quantity; {practical_metrics} gives both"
      - "the inset enlarges the high-specificity end"
  # The main tables' titles, part titles and notes (the author's wording, 2026-11-09,
  # E8.11), each also written as an editable file, main/<content>.docx (docx: below):
  # "Table N." in bold and the title, each part's title above it, its table, and the
  # notes in one paragraph below. Table 3 has one part, printed without a title.
  - content: analysis_set_composition
    kind: table
    number: Table 1
    title: "Composition of the analysis set. (a) By gene. (b) By ClinVar record status, 3–50 bp."
    make: table_parts
    parts:
      - {part: by_gene, title: "By gene", source: reports/evidence/tables/table1a_composition_by_gene.csv}
      - {part: by_clinvar_status, title: "By ClinVar record status, 3–50 bp", source: reports/evidence/tables/table1b_composition_by_clinvar_status.csv}
    notes:
      - "Labelled variants are those the assay calls damaging or normal; percentages are of labelled variants. *BRCA2*’s deposit stops at 10 bp, so the distal band holds six genes. All 13 predictors scored every variant. The 856 variants at the canonical dinucleotides, outside the scope of PP3 and BP4, are in {analysis_set_by_status}."
  - content: evidence_tiers_and_thresholds
    kind: table
    number: Table 2
    title: "Evidence tier of each predictor, and the thresholds of SpliceAI and Pangolin."
    make: table_parts
    parts:
      - {part: tiers, title: "In-sample tier, and held-out genes clearing each tier’s boundary", source: reports/evidence/tables/table3_evidence_tiers.csv}
      - {part: thresholds, title: "In-sample thresholds for SpliceAI (published basis) and Pangolin", source: reports/evidence/tables/table3b_thresholds.csv}
    notes:
      - "(a) The in-sample tier is the highest PP3 tier reached with the seven genes pooled, six in the distal band; a dash marks a tier not reached. In a held-out entry k/n (m), the band likelihood ratio at a threshold fitted on the other genes clears the tier’s boundary in k of n genes, and m folds are not evaluable. † Counted without *BRCA1* and *RAD51C*, whose assays helped select the model. (b) Thresholds are rounded to three significant figures in the direction that admits no variant the fitted threshold excludes; full values are in {thresholds_pathogenic, thresholds_benign}."
  - content: published_cut_point_by_clinvar_status
    kind: table
    number: Table 3
    title: "Band likelihood ratios at the published SpliceAI PP3 cut point, by ClinVar record status."
    make: table_parts
    parts:
      - {part: band_lr, source: reports/evidence/tables/table4a_spliceai_published_cut_by_arm.csv}
    notes:
      - "Values are the band likelihood ratio of SpliceAI on the published basis for scores of 0.2 or above, in the seven genes and without *BRCA1*. Record status stratifies the variants and never defines which are damaging. Counts, the benign side, each predictor at its in-sample Moderate threshold and the AUROC by arm are in {clinvar_status, within_gene_arms, arms_at_fitted_thresholds}."
  - content: practical_performance
    kind: table
    number: Table 4
    title: "Performance at the fitted thresholds and the published cut points."
    make: table_practical_performance
    options: {tools: [spliceai_walker, pangolin], clinvar_bands: [s3_10, s3_50]}
    sources:
      - reports/evidence/practical_metrics_by_threshold.csv
      - reports/evidence/suppl_analyses/c1_clinvar_reference_metrics.csv
    parts:
      - {part: seven_genes, title: "Held out in the seven genes"}
      - {part: clinvar, title: "Agreement with ClinVar classifications of at least one review star"}
    # the band (b) leaves out is named in the notes, with its P/LP count: the stage stops
    # if the note's count is not the one the source gives (E8.11)
    notes:
      - "(a) Each fold’s threshold, fitted on the other genes, is applied to the gene left out, and counts are added over the folds whose threshold reached the tier. Coverage is the share of labelled variants in the score band; a dash marks a tier not reached in-sample. The last column counts the folds reaching Supporting, Moderate and Strong (S, M, St), including folds too small for a likelihood ratio, so it can differ from the k/n of {evidence_tiers_and_thresholds}. (b) Among ClinVar classifications of at least one review star, the share of pathogenic or likely pathogenic (P/LP) variants at or above the published PP3 cut point and each in-sample PP3 threshold, and of benign or likely benign (B/LB) variants at or below the BP4 ones; no likelihood ratio or tier is formed from them. The distal band, with 3 P/LP variants, is left out. Further values are in {practical_metrics, clinvar_consistency}."

# The main tables' editable files (E8.11, the author's decision of 2026-11-09): A4, the
# margins all round, upright, or turned where the table is wider than the upright page
# allows; Arial, the table at table_pt and the title, part titles and notes at text_pt;
# the table ruled across only, at its top, below its header and at its foot, each rule
# rule_pt thick, no rule down and no shading.
docx:
  margin_cm: 2.5
  table_pt: 8
  text_pt: 9
  rule_pt: 1
  font: Arial

supplementary:
  # figures, numbered in the order the text first cites them (2026-11-08)
  - content: local_lr_curves
    kind: figure
    number: Supplementary Figure S1
    title: "Local likelihood ratio along the score for each of the 13 predictor columns, by distance band."
    legend: "Each row is a predictor column and each column a distance band. The line is the local likelihood ratio of a score window moving along the column’s score, and the shading its 5th–95th percentile range over 2,000 bootstrap draws clustered on gene. Dotted horizontal lines mark the Supporting, Moderate and Strong boundaries (2.08, 4.33 and 18.7), and the grey line a ratio of 1. Vertical lines mark the in-sample Moderate (dashed) and Strong (solid) thresholds where the tier is reached, and, for SpliceAI, the published PP3 cut point of 0.2 (orange). Each column is drawn on its own score scale ({local_lr_calibration})."
    destination: pdf
    description: "Local likelihood ratio against score for each of the thirteen predictor columns in each distance band, with the fitted thresholds."
    make: redraw_figure
    # evid_figures draws it 250 mm tall; drawn here at the artwork block's height limit,
    # its caption line at the foot at least caption_gap_mm below the last row's tick
    # labels, the panels shorter in proportion (the author's decision of 2026-11-05)
    options: {function: figure_s1, height_mm: 240, caption_gap_mm: 2}
    sources: [reports/evidence/evidence_thresholds.csv,
              reports/evidence/interval_lr_spliceai_walker_s3_10.csv, reports/evidence/interval_lr_spliceai_walker_s11_50.csv, reports/evidence/interval_lr_spliceai_walker_s3_50.csv,
              reports/evidence/interval_lr_spliceai_s3_10.csv, reports/evidence/interval_lr_spliceai_s11_50.csv, reports/evidence/interval_lr_spliceai_s3_50.csv,
              reports/evidence/interval_lr_pangolin_s3_10.csv, reports/evidence/interval_lr_pangolin_s11_50.csv, reports/evidence/interval_lr_pangolin_s3_50.csv,
              reports/evidence/interval_lr_alphagenome_s3_10.csv, reports/evidence/interval_lr_alphagenome_s11_50.csv, reports/evidence/interval_lr_alphagenome_s3_50.csv,
              reports/evidence/interval_lr_avi_s3_10.csv, reports/evidence/interval_lr_avi_s11_50.csv, reports/evidence/interval_lr_avi_s3_50.csv,
              reports/evidence/interval_lr_avi_splice_sites_s3_10.csv, reports/evidence/interval_lr_avi_splice_sites_s11_50.csv, reports/evidence/interval_lr_avi_splice_sites_s3_50.csv,
              reports/evidence/interval_lr_avi_splice_site_usage_s3_10.csv, reports/evidence/interval_lr_avi_splice_site_usage_s11_50.csv, reports/evidence/interval_lr_avi_splice_site_usage_s3_50.csv,
              reports/evidence/interval_lr_avi_splice_junctions_s3_10.csv, reports/evidence/interval_lr_avi_splice_junctions_s11_50.csv, reports/evidence/interval_lr_avi_splice_junctions_s3_50.csv,
              reports/evidence/interval_lr_cadd_s3_10.csv, reports/evidence/interval_lr_cadd_s11_50.csv, reports/evidence/interval_lr_cadd_s3_50.csv,
              reports/evidence/interval_lr_phylop_s3_10.csv, reports/evidence/interval_lr_phylop_s11_50.csv, reports/evidence/interval_lr_phylop_s3_50.csv,
              reports/evidence/interval_lr_phastcons_s3_10.csv, reports/evidence/interval_lr_phastcons_s11_50.csv, reports/evidence/interval_lr_phastcons_s3_50.csv,
              reports/evidence/interval_lr_gpn_msa_s3_10.csv, reports/evidence/interval_lr_gpn_msa_s11_50.csv, reports/evidence/interval_lr_gpn_msa_s3_50.csv,
              reports/evidence/interval_lr_nt_s3_10.csv, reports/evidence/interval_lr_nt_s11_50.csv, reports/evidence/interval_lr_nt_s3_50.csv]
  - content: threshold_dilution
    kind: figure
    number: Supplementary Figure S2
    title: "Strong thresholds and the number of training genes."
    legend: "The Strong threshold of four splice-aware predictors was refitted on every subset of two or more training genes. Top row: the share of subsets on which the Strong tier is reached. Bottom row: among the pairs of subset and held-out gene with an evaluable ratio, the share in which the band likelihood ratio at the subset’s threshold clears the Strong boundary. The distal band holds six genes, so its subsets have at most five ({dilution})."
    destination: pdf
    description: "For the Strong tier, the share of training-gene subsets on which it is reached and the share of held-out genes clearing it, by the number of training genes."
    make: redraw_figure
    options: {function: figure_s2}
    sources: [reports/evidence/threshold_dilution_summary.csv]
  - content: precision_recall_curves
    kind: figure
    number: Supplementary Figure S3
    title: "Precision–recall curves of four predictors in the seven training genes at 3–10, 11–50 and 3–50 bp."
    legend: "Each curve pools the seven genes, and the legend in each panel gives the area under that pooled curve (average precision). Markers show each predictor’s in-sample PP3 thresholds at Supporting (circle), Moderate (square) and Strong (triangle), and the open diamond the published PP3 cut point of 0.2 on SpliceAI; the dashed line marks the share of damaging variants. † The model of the Atlas combined score was selected on assays used in this study (Methods)."
    destination: pdf
    description: "Precision-recall curves of four predictors in each distance band, the seven genes pooled, with the fitted thresholds and the published cut point."
    make: figure_precision_recall
    sources:
      - reports/evidence/practical_roc_curves.csv
      - reports/evidence/practical_pr_curves.csv
      - reports/evidence/practical_curve_auc.csv
      - reports/evidence/practical_metrics_by_threshold.csv
  - content: clinvar_coverage_by_position
    kind: figure
    number: Supplementary Figure S4
    title: "ClinVar coverage of the analysis set by signed intronic position in the seven training genes."
    legend: "(a) The share of variants with any ClinVar record, and with a P/LP or B/LB classification, at each position from −50 bp (acceptor side) to +50 bp (donor side). (b) The classes behind the records at each position. Shading marks the canonical dinucleotides, outside the scope of PP3 and BP4, and dotted lines separate the distance bands ({clinvar_coverage})."
    destination: pdf
    description: "Share of the SGE variants with a ClinVar record, and their classifications, at each signed intronic offset in the seven genes."
    make: figure_clinvar_coverage
    sources: [reports/evidence/suppl_analyses/c2_clinvar_coverage_by_position.csv]
  - content: auroc_by_clinvar_status
    kind: figure
    number: Supplementary Figure S5
    title: "AUROC of each predictor column by ClinVar record status."
    legend: "The AUROC combined across genes, with its 95% CI, for variants classified in ClinVar (P/LP or B/LB), recorded without such a classification, and unrecorded. Left, 3–50 bp in the seven genes; centre, the same without *BRCA1*; right, 1–50 bp including the canonical dinucleotides, which lie outside the scope of PP3 and BP4. Record status stratifies the variants and never defines which are damaging."
    destination: pdf
    description: "AUROC of each predictor column by ClinVar record status, at 3–50 bp with and without BRCA1, and at 1–50 bp."
    make: redraw_figure
    options: {function: figure_s3}
    sources: [reports/evidence/territory_metrics_arms_noBRCA1.csv]
  # tables, numbered in the order the text first cites them (2026-11-08)
  - content: functional_standards
    kind: table
    number: Supplementary Table S1
    make: table_parts
    destination: excel
    title: "Functional standards of the seven training genes, *DDX3X* and *TP53*: assay, MaveDB accession, transcript, published classes and their mapping to damaging and normal, with variant counts."
    description: "Each gene's functional assay: publication, accession, transcript, class labels and their mapping to damaging, normal or missing, with variant counts."
    parts:
      - part: standards
        source: reports/evidence/supplement/tableS1_functional_standards.csv
        # every transcript as RefSeq accession.version, read from the MANE summary on the
        # gene's MANE Select row; DDX3X's deposit names the Ensembl transcript, printed
        # after it (the author's decision of 2026-11-07, D2; the source as it is)
        transcripts: {column: Transcript, gene: Gene, mane: data/evidence/reference_cache/mane/MANE.GRCh38.v1.5.summary.txt.gz}
    notes:
      - "Transcripts are MANE Select (version 1.5); for *DDX3X*, the Ensembl transcript named by the deposit is given in parentheses."
      - "Variants in a class mapped to missing are not labelled. The five further external genes are in {new_external_genes}."
  - content: label_sources
    kind: table
    number: Supplementary Table S2
    title: "The training genes’ label files against their cited sources and archived versions, and the thresholds before and after the labels were rebuilt."
    destination: excel
    description: "Each training gene's label file checked against its cited source and the archived versions, and the thresholds and tiers before and after the labels were rebuilt."
    make: table_parts
    parts:
      - part: audit
        title: "Each label file against its cited source"
        source: reports/evidence/label_audit_summary.csv
        # the source's "Table S1" is this paper's (E8.10, the author's decision of
        # 2026-11-09): printed as the configuration numbers it
        replace:
          - {old: "Table S1 cites no paper", new: "{functional_standards} cites no paper", count: 2}
      - {part: versions, title: "Each label file against the archived versions of its score set", source: reports/evidence/label_version_check.csv}
      - part: effect
        title: "Thresholds and tiers before and after the labels were rebuilt"
        source: reports/evidence/label_change_effect.csv
        # the fold counts are defined for PP3 only (the author's review of 2026-10-28)
        dashes:
          - {columns: [folds_reaching_old, folds_reaching_new], where: {side: bp4}}
    notes:
      - "(a) R1–R6 are the candidate rules for rebuilding a label file from its source, each described in its row."
      - "(c) A dash in the fold counts of a BP4 row: folds are counted on the PP3 side only."
  - {content: analysis_set_by_status, kind: table, number: Supplementary Table S3, make: table_parts, destination: excel,
     title: "Composition of the analysis set by distance band, gene and ClinVar record status, with the canonical dinucleotides.",
     description: "Variants, labelled variants, damaging and normal variants by gene, distance band and ClinVar record status.",
     notes: ["Labelled variants are those the assay calls damaging or normal. The canonical dinucleotides lie outside the scope of PP3 and BP4."],
     parts: [{part: composition, source: reports/evidence/supplement/tableS2_analysis_set.csv}]}
  - {content: predictor_columns, kind: table, number: Supplementary Table S4, make: table_parts, destination: excel,
     title: "The 13 predictor score columns: definition, version and scoring configuration, source, access date, licence, orientation, coverage and training data.",
     description: "Each predictor score column: what it is, its version and scoring configuration, source, licence, orientation, coverage and training data.",
     parts: [{part: columns, source: reports/evidence/supplement/tableS3_predictor_columns.csv}]}
  - content: training_signal
    kind: table
    number: Supplementary Table S5
    make: table_parts
    destination: pdf
    title: "Training signal of each predictor, its relation to the functional readout and its terms of use."
    description: "What each predictor was trained on, how that relates to the functional readout, and its terms of use."
    parts:
      - part: signal
        source: reports/evidence/tables/table2_training_signal.csv
        # the fusion's row names its table by number: printed as the configuration numbers it
        replace:
          - {old: "(Supplementary Table S9)", new: "({fusion})", count: 1}
  - {content: column_agreement, kind: table, number: Supplementary Table S6, make: table_parts, destination: pdf,
     title: "Agreement between related score columns: SpliceAI on the published and atlas bases, and the four Atlas scores against the AlphaGenome splice score.",
     description: "Agreement between related score columns: rank correlation and the variants on either side of the cut point.",
     notes: ["Spearman’s ρ over the 8,853 variants of the analysis set, including the canonical dinucleotides. For the two SpliceAI columns, the last two columns count the variants on opposite sides of the cut point of 0.2."],
