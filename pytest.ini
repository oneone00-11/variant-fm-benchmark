[pytest]
# Without testpaths a bare `pytest` from the repo root descends into .venv/ and
# ag-env/ and collects several thousand vendored library tests, which is why the
# suite had never been runnable as a whole. These two directories are the repo's
# own tests: tests/ holds the cross-cutting guardrails, phase1/tests/ the
# stage-local ones.
testpaths = tests phase1/tests
norecursedirs = .venv ag-env .git data
